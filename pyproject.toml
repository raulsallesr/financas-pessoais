[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["mobile"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "tests/*",
  ".venv/*",
]

[tool.coverage.report]
fail_under = 85
precision = 1
show_missing = true
skip_covered = true
