name: Atualizar histórico do Focus

on:
  schedule:
    # Segunda-feira, 12h30 no horário de Brasília.
    - cron: "30 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-historico-focus
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependência mínima
        run: python -m pip install "requests>=2.32,<3"

      - name: Atualizar o cache público
        run: python atualizar_focus_cache.py

      - name: Versionar somente quando houver mudança
        shell: bash
        run: |
          if git diff --quiet -- dados/focus_cache.json; then
            echo "Nenhuma mudança no histórico."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/focus_cache.json
          git commit -m "Atualiza histórico semanal do Focus [skip ci]"
          git push
