name: Atualizar Curva Tesouro

on:
  schedule:
    # Dias úteis, 16h30 no horário de Brasília.
    - cron: "30 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-curva-tesouro
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependência mínima
        run: python -m pip install "requests>=2.32,<3"

      - name: Atualizar o cache público
        run: python -m scripts.atualizar_curva_cache

      - name: Versionar somente quando houver mudança
        shell: bash
        run: |
          if git diff --quiet -- dados/curva_prefixada_cache.json; then
            echo "Nenhuma mudança na curva."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/curva_prefixada_cache.json
          git commit -m "Atualiza Curva Tesouro [skip ci]"
          git push
