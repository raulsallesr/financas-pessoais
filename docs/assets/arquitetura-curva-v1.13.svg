<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura da Curva Tesouro v1.13.1</title>
  <desc id="desc">Fluxo do CSV público do Tesouro Transparente pelo contrato validado, adaptador, motor puro, apresentação e interface FocusLens.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#184840" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="440" rx="28" fill="#f3f7f5"/>
  <text x="64" y="70" fill="#17332f" font-family="Arial, sans-serif" font-size="30" font-weight="700">Curva Tesouro v1.13.1</text>
  <text x="64" y="102" fill="#536965" font-family="Arial, sans-serif" font-size="17">Fonte pública → contrato validado → cálculo explicável → apresentação pura → interface</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(44 150)">
      <rect width="196" height="190" rx="18" fill="#ffffff" stroke="#d8e5e1"/>
      <text x="20" y="43" fill="#0f766e" font-size="13" font-weight="700" letter-spacing="1.1">FONTE</text>
      <text x="20" y="76" fill="#17332f" font-size="18" font-weight="700">Tesouro</text>
      <text x="20" y="99" fill="#17332f" font-size="18" font-weight="700">Transparente</text>
      <text x="20" y="130" fill="#536965" font-size="15">CSV diário</text>
      <text x="20" y="155" fill="#536965" font-size="15">ODbL 1.0</text>
      <text x="20" y="180" fill="#536965" font-size="15">sem autenticação</text>
    </g>
    <g transform="translate(278 150)">
      <rect width="196" height="190" rx="18" fill="#ffffff" stroke="#d8e5e1"/>
      <text x="20" y="43" fill="#0f766e" font-size="13" font-weight="700" letter-spacing="1.1">CONTRATO + I/O</text>
      <text x="20" y="78" fill="#17332f" font-size="18" font-weight="700">Validação e filtro</text>
      <text x="20" y="111" fill="#536965" font-size="15">schema + locale</text>
      <text x="20" y="136" fill="#536965" font-size="15">números finitos</text>
      <text x="20" y="161" fill="#536965" font-size="15">sem conflitos</text>
      <text x="20" y="186" fill="#536965" font-size="15">cache atômico</text>
    </g>
    <g transform="translate(512 150)">
      <rect width="196" height="190" rx="18" fill="#ffffff" stroke="#d8e5e1"/>
      <text x="20" y="43" fill="#0f766e" font-size="13" font-weight="700" letter-spacing="1.1">MOTOR PURO</text>
      <text x="20" y="78" fill="#17332f" font-size="18" font-weight="700">D-5 e D-21</text>
      <text x="20" y="111" fill="#536965" font-size="15">mesmo vencimento</text>
      <text x="20" y="136" fill="#536965" font-size="15">delta em bps</text>
      <text x="20" y="161" fill="#536965" font-size="15">estados da fonte</text>
      <text x="20" y="186" fill="#536965" font-size="15">sem interpolação</text>
    </g>
    <g transform="translate(746 150)">
      <rect width="196" height="190" rx="18" fill="#ffffff" stroke="#d8e5e1"/>
      <text x="20" y="43" fill="#0f766e" font-size="13" font-weight="700" letter-spacing="1.1">APRESENTAÇÃO</text>
      <text x="20" y="78" fill="#17332f" font-size="18" font-weight="700">Evidência visual</text>
      <text x="20" y="111" fill="#536965" font-size="15">formatação pt-BR</text>
      <text x="20" y="136" fill="#536965" font-size="15">cor + traço</text>
      <text x="20" y="161" fill="#536965" font-size="15">linhas da tabela</text>
      <text x="20" y="186" fill="#536965" font-size="15">sem Streamlit</text>
    </g>
    <g transform="translate(980 150)">
      <rect width="176" height="190" rx="18" fill="#ffffff" stroke="#d8e5e1"/>
      <text x="18" y="43" fill="#0f766e" font-size="13" font-weight="700" letter-spacing="1.1">INTERFACE</text>
      <text x="18" y="78" fill="#17332f" font-size="18" font-weight="700">FocusLens BR</text>
      <text x="18" y="111" fill="#536965" font-size="15">veredito primeiro</text>
      <text x="18" y="136" fill="#536965" font-size="15">gráfico + tabela</text>
      <text x="18" y="161" fill="#536965" font-size="15">detalhe progressivo</text>
      <text x="18" y="186" fill="#536965" font-size="15">responsivo</text>
    </g>
  </g>
  <g stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M240 245 H268"/>
    <path d="M474 245 H502"/>
    <path d="M708 245 H736"/>
    <path d="M942 245 H970"/>
  </g>
  <text x="64" y="394" fill="#a16207" font-family="Arial, sans-serif" font-size="16" font-weight="700">Guardrail:</text>
  <text x="151" y="394" fill="#536965" font-family="Arial, sans-serif" font-size="16">campo ausente não recebe zero; título ausente não recebe taxa estimada.</text>
</svg>
